version: '3'
services:
  vault:
    image: hashicorp/vault:1.14
    ports: ['8201:8200']
    networks: [internal]
    environment:
      VAULT_API_ADDR: http://127.0.0.1:8200
      VAULT_LOCAL_CONFIG: >-
        {
          "disable_mlock": 1,
          "backend": {
            "file": {
              "path": "/vault/file"
            }
          },
          "listener": {
            "tcp": {
              "address": "0.0.0.0:8201",
              "tls_disable": 1
            }
          },
          "default_lease_ttl": "168h",
          "max_lease_ttl": "720h"
        }
    cap_add:
      - IPC_LOCK
    volumes:
      - 'vault-data:/vault/file'

  core:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
    image: shieldproject/shield:local-core
    ports: ['9009:80']
    networks: [internal]
    command: ['/shield/init/core']
    environment:
      SHIELD_VAULT_ADDRESS: http://vault:8201
      SHIELD_API_BIND: core:80
    volumes:
      - 'shield-data:/var/shield'
      - 'shield-etc:/etc/shield'

  webdav:
    build:
      context: docker/webdav
      dockerfile: Dockerfile
    ports: ['9007:80']
    networks: [internal]
    environment:
      USERNAME: webdav
      PASSWORD: password
    volumes:
      - 'webdav-data:/var/webdav'

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
    image: shieldproject/shield:local-agent
    depends_on:
      - core
      - webdav
    ports: ['5444:5444']
    networks: [internal]
    command: ['/shield/init/agent']
    environment:
      SHIELD_API: 'http://core:80'
      SHIELD_AGENT_NAME: 'demo-shield-agent'
    volumes:
      - 'shield-data:/var/shield'
      - 'shield-etc:/etc/shield'
      - 'demo-data:/www'

  demo:
    build:
      context: docker/demo
      dockerfile: Dockerfile
    depends_on:
      - core
      - webdav
    ports: ['9008:80']
    networks: [internal]
    volumes:
      - 'demo-data:/www'

networks:
  internal:

volumes:
  vault-data:
  shield-data:
  shield-etc:
  webdav-data:
  demo-data:
