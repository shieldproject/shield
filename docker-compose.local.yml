name: shield-local

services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
    image: shieldproject/shield:local
    ports: ['9009:8080']
    networks: [internal]
    command: ['/shield/init/core']
    volumes:
      - 'shield-data:/shield/data'
      - 'vault-data:/shield/vault-data'
      - 'shield-etc:/etc/shield'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v2/info"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  agent:
    image: shieldproject/shield:local
    depends_on:
      core:
        condition: service_healthy
      webdav:
        condition: service_started
    ports: ['5444:5444']
    networks: [internal]
    command: ['/shield/init/agent']
    environment:
      SHIELD_API: 'http://core:8080'
      SHIELD_AGENT_NAME: 'demo-shield-agent'
    volumes:
      - 'demo-data:/www'
    restart: unless-stopped

  webdav:
    build:
      context: docker/webdav
      dockerfile: Dockerfile
    ports: ['9007:80']
    networks: [internal]
    environment:
      USERNAME: webdav
      PASSWORD: password
    volumes:
      - 'webdav-data:/var/webdav'
    restart: unless-stopped

  demo:
    build:
      context: docker/demo
      dockerfile: Dockerfile
    depends_on:
      core:
        condition: service_healthy
    ports: ['9008:80']
    networks: [internal]
    volumes:
      - 'demo-data:/www'

networks:
  internal:

volumes:
  shield-data:
  vault-data:
  shield-etc:
  webdav-data:
  demo-data:
